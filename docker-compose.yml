services:
  python-ai:
    build:
      context: .
      dockerfile: python/Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      python-ai:
        condition: service_started
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      PYTHON_PROCTORING_URL: http://python-ai:8001
      PYTHON_PROCTORING_TIMEOUT_MS: "15000"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["seed"]
    working_dir: /app
    env_file:
      - .env.docker
    command: ["npx", "tsx", "scripts/seed.ts"]
