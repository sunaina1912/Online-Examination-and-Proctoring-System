services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  python-ai:
    build:
      context: .
      dockerfile: python/Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      python-ai:
        condition: service_started
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/proctorx
      NEXTAUTH_URL: http://localhost:3000
      PYTHON_PROCTORING_URL: http://python-ai:8001
      PYTHON_PROCTORING_TIMEOUT_MS: "15000"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["seed"]
    depends_on:
      mongo:
        condition: service_healthy
    working_dir: /app
    env_file:
      - .env.docker
    environment:
      MONGODB_URI: mongodb://mongo:27017/proctorx
    command: ["npx", "tsx", "scripts/seed.ts"]

volumes:
  mongo-data:
