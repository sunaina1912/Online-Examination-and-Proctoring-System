<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1400" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111D"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14243D"/>
      <stop offset="1" stop-color="#0E1A2D"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow2" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14V0Z" fill="#7DD3FC"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #A9BDD1; }
      .boxTitle { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .boxBody { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #C3D1DE; }
      .step { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #8ECDF8; letter-spacing: 0.12em; }
      .line { stroke: #7DD3FC; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow2); }
      .lineWarm { stroke: #F6AD55; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow2); }
      .lineGreen { stroke: #68D391; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow2); }
    </style>
  </defs>

  <rect width="1400" height="980" rx="32" fill="url(#bg2)"/>
  <circle cx="1220" cy="150" r="200" fill="#17314E" opacity="0.34"/>
  <circle cx="140" cy="840" r="220" fill="#132A45" opacity="0.34"/>

  <text x="72" y="76" class="title">ProctorX Exam and Proctoring Data Flow</text>
  <text x="72" y="110" class="subtitle">End-to-end flow from exam creation to randomized delivery, live monitoring, scoring, and reporting</text>

  <rect x="76" y="150" width="1248" height="760" rx="28" fill="#0D1729" stroke="#243551" stroke-width="2"/>

  <rect x="120" y="210" width="240" height="108" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="148" y="242" class="step">STEP 1</text>
  <text x="148" y="276" class="boxTitle">Admin Creates Exam</text>
  <text x="148" y="302" class="boxBody">Title, duration, marks,</text>
  <text x="148" y="324" class="boxBody">questions, randomize flag</text>

  <rect x="430" y="210" width="260" height="108" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="458" y="242" class="step">STEP 2</text>
  <text x="458" y="276" class="boxTitle">Exam Stored</text>
  <text x="458" y="302" class="boxBody">Saved through /api/exams</text>
  <text x="458" y="324" class="boxBody">into Exam collection</text>

  <rect x="760" y="210" width="260" height="108" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="788" y="242" class="step">STEP 3</text>
  <text x="788" y="276" class="boxTitle">Student Authenticates</text>
  <text x="788" y="302" class="boxBody">NextAuth validates</text>
  <text x="788" y="324" class="boxBody">credentials and role</text>

  <rect x="1080" y="210" width="180" height="108" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="1108" y="242" class="step">STEP 4</text>
  <text x="1108" y="276" class="boxTitle">JWT Session</text>
  <text x="1108" y="302" class="boxBody">User id + role</text>
  <text x="1108" y="324" class="boxBody">attached</text>

  <rect x="120" y="414" width="280" height="126" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="148" y="446" class="step">STEP 5</text>
  <text x="148" y="480" class="boxTitle">Student Starts Exam</text>
  <text x="148" y="506" class="boxBody">POST /api/submissions</text>
  <text x="148" y="528" class="boxBody">action=start with examId</text>

  <rect x="470" y="414" width="300" height="126" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="498" y="446" class="step">STEP 6</text>
  <text x="498" y="480" class="boxTitle">Delivery Plan Built</text>
  <text x="498" y="506" class="boxBody">Questions optionally shuffled</text>
  <text x="498" y="528" class="boxBody">MCQ option order stored</text>

  <rect x="840" y="414" width="340" height="126" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="868" y="446" class="step">STEP 7</text>
  <text x="868" y="480" class="boxTitle">Submission Created</text>
  <text x="868" y="506" class="boxBody">status=in_progress, questionOrder,</text>
  <text x="868" y="528" class="boxBody">optionOrders, grace window, timer</text>

  <rect x="120" y="624" width="280" height="144" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="148" y="656" class="step">STEP 8</text>
  <text x="148" y="690" class="boxTitle">Exam UI Runs</text>
  <text x="148" y="716" class="boxBody">Student answers questions,</text>
  <text x="148" y="738" class="boxBody">navigator updates, autosave</text>
  <text x="148" y="760" class="boxBody">tracks current question</text>

  <rect x="470" y="624" width="300" height="144" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="498" y="656" class="step">STEP 9</text>
  <text x="498" y="690" class="boxTitle">Proctoring Stream</text>
  <text x="498" y="716" class="boxBody">Camera, tab switch, audio,</text>
  <text x="498" y="738" class="boxBody">gaze, snapshots, metrics</text>
  <text x="498" y="760" class="boxBody">sent to /api/proctoring</text>

  <rect x="840" y="624" width="340" height="144" rx="22" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="868" y="656" class="step">STEP 10</text>
  <text x="868" y="690" class="boxTitle">Risk and Evidence Update</text>
  <text x="868" y="716" class="boxBody">riskScore recalculated, events</text>
  <text x="868" y="738" class="boxBody">appended, flagged when score</text>
  <text x="868" y="760" class="boxBody">reaches threshold</text>

  <rect x="120" y="816" width="280" height="64" rx="20" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="148" y="855" class="boxTitle">STEP 11  Student Submits Exam</text>

  <rect x="470" y="804" width="300" height="88" rx="20" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="498" y="838" class="boxTitle">STEP 12  Score + Plagiarism Check</text>
  <text x="498" y="862" class="boxBody">Selected options normalized before scoring</text>

  <rect x="840" y="804" width="340" height="88" rx="20" fill="url(#card2)" stroke="#33507A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="868" y="838" class="boxTitle">STEP 13  Reports and Review</text>
  <text x="868" y="862" class="boxBody">Admins inspect score, flags, evidence, answers</text>

  <line x1="360" y1="264" x2="430" y2="264" class="line"/>
  <line x1="690" y1="264" x2="760" y2="264" class="line"/>
  <line x1="1020" y1="264" x2="1080" y2="264" class="line"/>
  <line x1="1170" y1="318" x2="1170" y2="414" class="line"/>
  <line x1="1020" y1="477" x2="840" y2="477" class="lineWarm"/>
  <line x1="770" y1="477" x2="400" y2="477" class="line"/>
  <line x1="260" y1="540" x2="260" y2="624" class="line"/>
  <line x1="400" y1="696" x2="470" y2="696" class="line"/>
  <line x1="770" y1="696" x2="840" y2="696" class="lineGreen"/>
  <line x1="260" y1="768" x2="260" y2="816" class="line"/>
  <line x1="400" y1="848" x2="470" y2="848" class="lineWarm"/>
  <line x1="770" y1="848" x2="840" y2="848" class="lineGreen"/>

  <text x="96" y="942" class="subtitle">Primary persistence path: Exam and Submission collections in MongoDB through Mongoose models</text>
</svg>
