<svg width="1400" height="920" viewBox="0 0 1400 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#121A2D"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#16213A"/>
      <stop offset="1" stop-color="#10192C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14V0Z" fill="#63B3ED"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #9FB3C8; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #D7E3F4; }
      .label { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .body { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #B8C7D9; }
      .small { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #89A4C3; letter-spacing: 0.08em; }
      .line { stroke: #63B3ED; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.95; }
      .line2 { stroke: #F6AD55; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.95; }
      .line3 { stroke: #68D391; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.95; }
    </style>
  </defs>

  <rect width="1400" height="920" rx="32" fill="url(#bg)"/>
  <circle cx="1230" cy="120" r="180" fill="#1B2A49" opacity="0.35"/>
  <circle cx="150" cy="760" r="200" fill="#17233D" opacity="0.45"/>

  <text x="76" y="74" class="title">ProctorX Architecture Diagram</text>
  <text x="76" y="108" class="subtitle">Next.js 14 online exam proctoring platform with role-based access, randomized delivery, and live proctoring telemetry</text>

  <rect x="74" y="156" width="1252" height="690" rx="28" fill="#0E1628" stroke="#21304D" stroke-width="2"/>
  <text x="100" y="198" class="section">Application Layers</text>

  <rect x="110" y="234" width="240" height="128" rx="22" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="138" y="275" class="small">ACTORS</text>
  <text x="138" y="312" class="label">Users</text>
  <text x="138" y="338" class="body">Admin</text>
  <text x="138" y="362" class="body">Examiner</text>
  <text x="138" y="386" class="body">Student</text>

  <rect x="420" y="214" width="330" height="170" rx="24" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="255" class="small">PRESENTATION</text>
  <text x="450" y="292" class="label">Next.js App Router UI</text>
  <text x="450" y="320" class="body">Landing, auth, admin, exam pages</text>
  <text x="450" y="346" class="body">Components, timers, question cards</text>
  <text x="450" y="372" class="body">Client hooks for exam + proctoring</text>

  <rect x="840" y="214" width="360" height="170" rx="24" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="255" class="small">AUTHENTICATION</text>
  <text x="870" y="292" class="label">NextAuth Credentials</text>
  <text x="870" y="320" class="body">Email + password login</text>
  <text x="870" y="346" class="body">JWT session strategy</text>
  <text x="870" y="372" class="body">Role injection into session token</text>

  <rect x="280" y="470" width="360" height="180" rx="24" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="512" class="small">SERVER API</text>
  <text x="310" y="548" class="label">Route Handlers</text>
  <text x="310" y="576" class="body">/api/exams</text>
  <text x="310" y="602" class="body">/api/submissions</text>
  <text x="310" y="628" class="body">/api/proctoring, /api/reports</text>

  <rect x="706" y="470" width="360" height="180" rx="24" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="736" y="512" class="small">BUSINESS LOGIC</text>
  <text x="736" y="548" class="label">Core Services</text>
  <text x="736" y="576" class="body">Exam delivery and randomization</text>
  <text x="736" y="602" class="body">Scoring + plagiarism detection</text>
  <text x="736" y="628" class="body">Risk scoring and evidence aggregation</text>

  <rect x="1130" y="470" width="160" height="180" rx="24" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="512" class="small">DB LAYER</text>
  <text x="1160" y="548" class="label">MongoDB</text>
  <text x="1160" y="576" class="body">Mongoose</text>
  <text x="1160" y="602" class="body">connection</text>
  <text x="1160" y="628" class="body">cache</text>

  <rect x="280" y="710" width="300" height="96" rx="22" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="308" y="748" class="small">MODEL</text>
  <text x="308" y="782" class="label">User</text>
  <text x="400" y="782" class="body">roles and credentials</text>

  <rect x="606" y="710" width="300" height="96" rx="22" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="634" y="748" class="small">MODEL</text>
  <text x="634" y="782" class="label">Exam</text>
  <text x="726" y="782" class="body">questions, flags, metadata</text>

  <rect x="932" y="710" width="300" height="96" rx="22" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="748" class="small">MODEL</text>
  <text x="960" y="782" class="label">Submission</text>
  <text x="1088" y="782" class="body">answers, risk, evidence, status</text>

  <rect x="110" y="470" width="120" height="180" rx="24" fill="url(#panel)" stroke="#2F4B70" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="512" class="small">DEVICE</text>
  <text x="136" y="548" class="label">Browser APIs</text>
  <text x="136" y="576" class="body">Camera</text>
  <text x="136" y="602" class="body">Visibility</text>
  <text x="136" y="628" class="body">Clipboard</text>

  <line x1="350" y1="298" x2="420" y2="298" class="line"/>
  <line x1="750" y1="298" x2="840" y2="298" class="line"/>
  <line x1="585" y1="384" x2="460" y2="470" class="line"/>
  <line x1="915" y1="384" x2="898" y2="470" class="line"/>
  <line x1="640" y1="560" x2="706" y2="560" class="line2"/>
  <line x1="1066" y1="560" x2="1130" y2="560" class="line3"/>
  <line x1="170" y1="470" x2="170" y2="362" class="line"/>
  <line x1="430" y1="710" x2="430" y2="650" class="line3"/>
  <line x1="756" y1="710" x2="856" y2="650" class="line3"/>
  <line x1="1082" y1="710" x2="1210" y2="650" class="line3"/>

  <text x="96" y="874" class="subtitle">Core source references: src/lib/auth.ts, src/lib/exam.ts, src/app/api/*, src/models/*</text>
</svg>
